name: Sincronizar resultados MNF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-nfl-results.yml"
      - "app/api/automation/nfl-results/route.ts"
      - "lib/github-oidc.ts"
      - "lib/nfl-results.ts"
  schedule:
    # Respaldo de GitHub. La automatización vinculada al Site es el disparador principal.
    # Martes 04:17, 05:17 y 06:17 UTC cubren la noche del lunes en Ciudad Juárez
    # tanto durante MDT como durante MST. GitHub puede retrasar eventos schedule.
    - cron: "17 4,5,6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-nfl-results
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener credencial de ejecución
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fquiniela-mnf-2026.ablanco66.chatgpt.site")"
          token="$(jq -r '.value' <<<"${response}")"
          test -n "${token}" && test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Consultar y procesar marcadores
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            https://quiniela-mnf-2026.ablanco66.chatgpt.site/api/automation/nfl-results)"

          jq . <<<"${response}"

          status="$(jq -r '.status // "error"' <<<"${response}")"
          pending="$(jq -r '.pending // 0' <<<"${response}")"
          awaiting="$(jq -r '.awaitingConfirmation // 0' <<<"${response}")"
          errors="$(jq -r '.errors // 0' <<<"${response}")"
          confirmed="$(jq -r '.confirmed // 0' <<<"${response}")"

          {
            echo "### Sincronización MNF"
            echo "- Estado: ${status}"
            echo "- Confirmados en esta lectura: ${confirmed}"
            echo "- Pendientes: ${pending}"
            echo "- Esperando segunda lectura: ${awaiting}"
            echo "- Errores: ${errors}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${status}" != "checked" ] || [ "${errors}" -ne 0 ]; then
            echo "::error::La sincronización devolvió estado ${status} con ${errors} error(es)."
            exit 1
          fi

          if [ "${pending}" -gt 0 ] || [ "${awaiting}" -gt 0 ]; then
            echo "::notice::La lectura fue válida; una ejecución posterior completará la doble confirmación."
          else
            echo "Sincronización concluida: no quedan resultados pendientes."
          fi
